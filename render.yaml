services:
  - type: web
    name: ai-study-helper-backend
    env: docker
    dockerContext: ./backend
    region: ohio
    plan: free
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 8000

  - type: web
    name: ai-study-helper-frontend
    env: docker
    dockerContext: ./frontend
    region: ohio
    plan: free
    envVars:
      - key: REACT_APP_BACKEND_URL
        fromService:
          type: web
          name: ai-study-helper-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: PORT
        value: 80
